IDS_QUICKSEND_MSGTEXTWELCOME=Bienvenue\nBienvenue dans l'envoi rapide\nAprès la connexion au compte Maxthon, vous pouvez envoyer rapidement des liens, des images et des fichiers à d'autres appareils.\nActuellement, l'envoi rapide peut envoyer des fichiers inférieurs à {fileMaxSizeStr}. Le fichier sera expiré dans 24 heures.\nVeuillez entrer les commandes ci-dessous pour afficher plus d'informations.\n\nEntrer « /h » pour voir l'aide
