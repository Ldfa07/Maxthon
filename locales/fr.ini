IDS_CERT_ERROR_AUTHORITY_INVALID_DESCRIPTION=Le certificat du serveur n'est pas approuvé.
IDS_CERT_ERROR_AUTHORITY_INVALID_DETAILS=Impossible de vérifier sur le serveur qu'il s'agit bien du domaine <strong>$1</strong>, car son certificat de sécurité n'est pas considéré comme fiable par le système d'exploitation de votre ordinateur. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.
IDS_CERT_ERROR_CERTIFICATE_TRANSPARENCY_REQUIRED_DESCRIPTION=Le certificat du serveur n'a pas été communiqué tel que le prévoient les règles de transparence des certificats.
IDS_CERT_ERROR_CERTIFICATE_TRANSPARENCY_REQUIRED_DETAILS=Le certificat présenté par le serveur n'a pas été communiqué au public. Selon les règles de transparence des certificats, certains certificats doivent obligatoirement être communiqués publiquement pour garantir qu'ils sont dignes de confiance et qu'ils protègent contre les individus malveillants.
IDS_CERT_ERROR_COMMON_NAME_INVALID_DESCRIPTION=Le certificat du serveur ne correspond pas à l'URL.
IDS_CERT_ERROR_COMMON_NAME_INVALID_DETAILS=Impossible de vérifier sur le serveur qu'il s'agit bien du domaine <strong>$1</strong>, car son certificat de sécurité provient du domaine <strong>$2</strong>. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.
IDS_CERT_ERROR_CONTAINS_ERRORS_DESCRIPTION=Le certificat du serveur contient des erreurs.
IDS_CERT_ERROR_CONTAINS_ERRORS_DETAILS=Impossible de vérifier sur le serveur qu'il s'agit bien du domaine <strong>$1</strong>, car son certificat de sécurité contient des erreurs. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.
IDS_CERT_ERROR_EXPIRED_DESCRIPTION=Le certificat du serveur a expiré.
IDS_CERT_ERROR_EXPIRED_DETAILS="{1,plural, =1{Impossible de vérifier que ce serveur est bien <strong>{0}</strong>, car son certificat de sécurité a expiré hier. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique. L'horloge de votre ordinateur indique actuellement : {2, date, full}. Cela vous semble-t-il correct ? Si ce n'est pas le cas, vous devez corriger l'horloge de votre système, puis actualiser la page.}one{Impossible de vérifier que ce serveur est bien <strong>{0}</strong>, car son certificat de sécurité a expiré il y a # jour. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique. L'horloge de votre ordinateur indique actuellement : {2, date, full}. Cela vous semble-t-il correct ? Si ce n'est pas le cas, vous devez corriger l'horloge de votre système, puis actualiser la page.}other{Impossible de vérifier que ce serveur est bien <strong>{0}</strong>, car son certificat de sécurité a expiré il y a # jours. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique. L'horloge de votre ordinateur indique actuellement : {2, date, full}. Cela vous semble-t-il correct ? Si ce n'est pas le cas, vous devez corriger l'horloge de votre système, puis actualiser la page.}}"
IDS_CERT_ERROR_INVALID_CERT_DESCRIPTION=Le certificat du serveur n'est pas valide.
IDS_CERT_ERROR_INVALID_CERT_DETAILS=Vous avez tenté de contacter <strong>$1</strong>, mais le certificat présenté par le serveur est incorrect.
IDS_CERT_ERROR_NAME_CONSTRAINT_VIOLATION_DESCRIPTION=Le certificat du serveur ne respecte pas les restrictions de noms.
IDS_CERT_ERROR_NAME_CONSTRAINT_VIOLATION_DETAILS=Impossible de vérifier sur le serveur qu'il s'agit bien du domaine <strong>$1</strong>. Il se peut que son certificat de sécurité ait été émis de manière frauduleuse. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.
IDS_CERT_ERROR_NOT_VALID_AT_THIS_TIME_DESCRIPTION=Le certificat actuel du serveur n'est pas valide.
IDS_CERT_ERROR_NOT_VALID_AT_THIS_TIME_DETAILS=Impossible de vérifier que ce serveur est bien <strong>$1</strong>, car son certificat de sécurité actuel n'est pas valide. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.
IDS_CERT_ERROR_NOT_YET_VALID_DESCRIPTION=Le certificat du serveur n'est pas encore valide.
IDS_CERT_ERROR_NOT_YET_VALID_DETAILS="{1,plural, =1{Impossible de vérifier que ce serveur est bien <strong>{0}</strong>, car la date d'émission de son certificat de sécurité est fixée à demain. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.}one{Impossible de vérifier que ce serveur est bien <strong>{0}</strong>, car la date d'émission de son certificat de sécurité est ultérieure de # jour à la date du jour. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.}other{Impossible de vérifier que ce serveur est bien <strong>{0}</strong>, car la date d'émission de son certificat de sécurité est ultérieure de # jours à la date du jour. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.}}"
IDS_CERT_ERROR_NO_REVOCATION_MECHANISM_DESCRIPTION=Aucun système de révocation trouvé
IDS_CERT_ERROR_NO_REVOCATION_MECHANISM_DETAILS=Impossible de vérifier sur le serveur qu'il s'agit bien du domaine <strong>$1</strong>. Il se peut que son certificat de sécurité ait été révoqué. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.
IDS_CERT_ERROR_NO_SUBJECT_ALTERNATIVE_NAMES_DETAILS=Impossible de vérifier que ce serveur est bien <strong>$1</strong>, car son certificat de sécurité ne contient pas l'extension "Subject Alternative Names" (Autres noms de l'objet). Cela peut être dû à une mauvaise configuration ou à l'interception de votre connexion par un pirate informatique.
IDS_CERT_ERROR_PASSIVE_CONTENT_DESCRIPTION=Cette page inclut des ressources qui ont été chargées avec des erreurs de certificat.
IDS_CERT_ERROR_PASSIVE_CONTENT_SUMMARY=contenu avec des erreurs de certificat
IDS_CERT_ERROR_REVOKED_CERT_DESCRIPTION=Le certificat du serveur a été révoqué.
IDS_CERT_ERROR_REVOKED_CERT_DETAILS=Vous avez tenté d'accéder à <strong>$1</strong>, mais le certificat présenté par le serveur a été révoqué par son émetteur. Cela signifie que le certificat présenté par le serveur ne doit pas être approuvé. Il est donc possible que vous communiquiez avec un pirate informatique.
IDS_CERT_ERROR_SUMMARY_PINNING_FAILURE_DESCRIPTION=Le certificat du serveur semble être contrefait.
IDS_CERT_ERROR_SUMMARY_PINNING_FAILURE_DETAILS=Le serveur dispose d'un certificat qui ne répond pas aux exigences intégrées. Celles-ci sont incluses dans certains sites Web très sécurisés afin de vous protéger.
IDS_CERT_ERROR_UNABLE_TO_CHECK_REVOCATION_DESCRIPTION=Impossible de vérifier le certificat du serveur.
IDS_CERT_ERROR_UNABLE_TO_CHECK_REVOCATION_DETAILS=Impossible de vérifier sur le serveur qu'il s'agit bien du domaine <strong>$1</strong>. Il se peut que son certificat de sécurité ait été révoqué. Cela peut être dû à une mauvaise configuration ou bien à l'interception de votre connexion par un pirate informatique.
IDS_CERT_ERROR_UNKNOWN_ERROR_DESCRIPTION=Erreur inconnue liée au certificat du serveur.
IDS_CERT_ERROR_UNKNOWN_ERROR_DETAILS=Une erreur inconnue s'est produite.
IDS_CERT_ERROR_VALIDITY_TOO_LONG_DESCRIPTION=La durée de validité du certificat du serveur est trop longue.
IDS_CERT_ERROR_VALIDITY_TOO_LONG_DETAILS=Vous avez essayé d'accéder à <strong>$1</strong>, mais la durée de validité du certificat du serveur est trop longue pour être fiable.
IDS_CERT_ERROR_WEAK_KEY_DESCRIPTION=Le certificat du serveur contient une clé de chiffrement faible.
IDS_CERT_ERROR_WEAK_KEY_DETAILS=Vous avez tenté d'accéder à <strong>$1</strong>, mais le serveur a présenté un certificat contenant une clé faible. Il est possible qu'un pirate ait compromis la clé privée. Il est donc possible que le serveur auquel vous avez accédé ne soit pas celui que vous croyez, et que vous soyez en train de communiquer avec un pirate informatique.
IDS_CERT_ERROR_WEAK_SIGNATURE_ALGORITHM_DESCRIPTION=Le certificat du serveur a été signé avec un algorithme de signature faible.
IDS_CERT_ERROR_WEAK_SIGNATURE_ALGORITHM_DETAILS=Vous avez tenté d'accéder à <strong>$1</strong>, mais le serveur a présenté un certificat signé à l'aide d'un algorithme de signature faible (par exemple, SHA-1). Il est possible que le certificat fourni par le serveur ait été falsifié. Il se peut donc que le serveur ne soit pas celui auquel vous souhaitez accéder, et qu'il s'agisse d'une tentative de piratage.
