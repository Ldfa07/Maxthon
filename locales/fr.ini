IDS_CONNECTION_HELP_CONNECTION_NOT_PRIVATE_DETAILS=<h4>Étape 1 : Connectez-vous au portail</h4>\
<p>Pour utiliser les réseaux Wi-Fi de lieux publics tels que les cafés ou les aéroports, vous devez vous connecter. Pour afficher la page de connexion, accédez à une page dont l'URL contient <code>http://</code>.</p>\
<ol>\
<li>Accédez à n'importe quel site Web dont l'adresse commence par <code>http://</code>, telle que <a href="http://example.com\ target="_blank">http://example.com</a>.</li>\
<li>Sur la page de connexion qui s'affiche, connectez-vous pour utiliser Internet.</li>\
</ol>\
<h4>Étape 2 : Ouvrez la page en mode navigation privée (ordinateur uniquement)</h4>\
<p>Ouvrez la page que vous consultiez dans une fenêtre de navigation privée.</p>\
<p>Si la page s'affiche, cela signifie qu'une extension Maxthon ne fonctionne pas correctement. Pour corriger cette erreur, désactivez l'extension en question.</p>\
<h4>Étape 3 : Mettez à jour votre système d'exploitation</h4>\
<p>Assurez-vous que votre appareil est à jour.</p>\
<h4>Étape 4 : Désactivez temporairement votre logiciel antivirus</h4>\
<p>Ce message s'affiche si vous avez un logiciel antivirus qui propose une "protection HTTPS" ou une "analyse HTTPS" bloquant la fonctionnalité de sécurité de Maxthon.</p>\
<p>Pour corriger cette erreur, désactivez votre logiciel antivirus. Si la page fonctionne à la suite de cette opération, désactivez ce logiciel lorsque vous utilisez des sites sécurisés.</p>\
<p>N'oubliez pas de le réactiver par la suite.</p>\
<h4>Étape 5 : Obtenez de l'aide supplémentaire</h4>\
<p>Si le message d'erreur s'affiche toujours, contactez le propriétaire du site.</p>
IDS_CONNECTION_HELP_CONNECTION_NOT_PRIVATE_TITLE=Votre connexion n'est pas privée, <span class="error-code">NET::ERR_CERT_AUTHORITY_INVALID</span>, <span class="error-code">ERR_CERT_COMMON_NAME_INVALID</span>, <span class="error-code">NET::ERR_CERT_WEAK_SIGNATURE_ALGORITHM</span>, <span class="error-code">ERR_CERT_SYMANTEC_LEGACY</span> ou Erreur de certificat SSL
IDS_CONNECTION_HELP_CONNECT_TO_NETWORK_DETAILS=<p>Ce message s'affiche si vous utilisez un portail Wi-Fi auquel vous devez vous connecter pour accéder à Internet.</p>\
<p>Pour corriger cette erreur, cliquez sur <strong>Se connecter</strong> sur la page que vous essayez d'ouvrir.</p>
IDS_CONNECTION_HELP_CONNECT_TO_NETWORK_TITLE=Se connecter au réseau
IDS_CONNECTION_HELP_GENERAL_HELP=<p>Si vous ne parvenez pas à ouvrir un site Web dans Maxthon, essayez d'abord de corriger le problème en suivant ces étapes :</p>\
<ol>\
<li>Vérifiez que l'adresse ne contient pas de faute de frappe.</li>\
<li>Assurez-vous que votre connexion Internet fonctionne normalement.</li>\
<li>Contactez le propriétaire du site.</li>\
</ol>
IDS_CONNECTION_HELP_HEADING=Corriger les erreurs de connexion
IDS_CONNECTION_HELP_INCORRECT_CLOCK_DETAILS=<p>Ce message s'affiche si la date et l'heure de votre ordinateur ou de votre appareil mobile sont incorrectes.</p>\
<p>Pour corriger cette erreur, ouvrez l'horloge de votre appareil et assurez-vous que l'heure et la date sont correctes.</p>
IDS_CONNECTION_HELP_INCORRECT_CLOCK_TITLE=Votre horloge est en retard., Votre horloge est en avance. ou <span class="error-code">NET::ERR_CERT_DATE_INVALID</span>
IDS_CONNECTION_HELP_MITM_SOFTWARE_DETAILS:win=<p>Ce message d'erreur s'affiche si le logiciel Superfish est installé sur votre ordinateur Windows.</p>\
<p>Suivez ces étapes pour désactiver temporairement le logiciel afin d'accéder au Web. Vous devez disposer des droits d'administrateur.</p>\
<ol>\
<li>Cliquez sur <strong>Démarrer</strong>, puis recherchez et sélectionnez l'option <strong>Afficher les services locaux</strong>\
<li>Sélectionnez <strong>VisualDiscovery</strong>\
<li>Sous <strong>Type de démarrage</strong>, sélectionnez <strong>Désactivé</strong>\
<li>Sous <strong>État du service</strong>, cliquez sur <strong>Arrêter</strong>\
<li>Cliquez sur <strong>Appliquer</strong>, puis sur <strong>OK</strong>\
<li>Pour savoir comment supprimer définitivement le logiciel de votre ordinateur, consultez le <a href="https://support.maxthon.com/chrome/answer/6098869">Centre d'aide Maxthon</a>\
</ol>
IDS_CONNECTION_HELP_MITM_SOFTWARE_TITLE:win=Un logiciel installé sur votre ordinateur empêche Maxthon de se connecter au Web de manière sécurisée (sous Windows uniquement)
